name: Tag release

# When a "Release x.y.z" PR merges to main, this pushes the matching vX.Y.Z tag, which triggers
# release.yml to publish. Cut releases with `pnpm release <version>` (see README "Releasing") — this
# workflow is the automatic second half.
#
# Required secrets:
#   DAHRK_SIGNING_KEY - the bot's OpenSSH *private* signing key (public half registered as a signing key
#                 on the `dahrk-ai` GitHub account). Present: the tag is annotated and SSH-signed, so it
#                 shows as verified. Absent: a plain lightweight tag, exactly as before.
#   RELEASE_PAT - a PAT with `repo` scope (or a fine-grained PAT with Contents: read/write on this
#                 repo). The tag MUST be pushed with a PAT, not the default GITHUB_TOKEN: GitHub does
#                 not re-trigger tag-driven workflows for tags pushed by GITHUB_TOKEN, so release.yml
#                 would never fire. If RELEASE_PAT is unset, this job no-ops with a notice and you can
#                 fall back to the manual `git tag vX.Y.Z && git push origin vX.Y.Z` on main.

on:
  push:
    branches: [main]
    paths: ["apps/edge-node/package.json"]

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_PAT is configured
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::notice::RELEASE_PAT not set — skipping auto-tag. Push the tag manually: git tag vX.Y.Z && git push origin vX.Y.Z"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - if: env.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Create and push tag
        if: env.skip != 'true'
        env:
          DAHRK_SIGNING_KEY: ${{ secrets.DAHRK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/edge-node/package.json').version")
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::tag ${TAG} already exists — nothing to do"
            exit 0
          fi
          # The same bot identity every other Dahrk commit uses, so the signature below can verify: a
          # signature only counts as verified when the email is a verified address on the account that
          # owns the key, and `release@dahrk.ai` never was one.
          git config user.name "Dahrk"
          git config user.email "noreply@dahrk.ai"
          # With the key present the tag is ANNOTATED and signed - a lightweight tag is just a ref and
          # cannot carry a signature. Without it, the tag stays lightweight exactly as before, so a repo
          # with no secret set behaves identically. Nothing downstream assumes one or the other:
          # `release.mjs` already dereferences with `^{commit}`.
          if [ -n "${DAHRK_SIGNING_KEY:-}" ]; then
            KEY_FILE="$(mktemp)"
            trap 'rm -f "$KEY_FILE"' EXIT
            printf '%s\n' "$DAHRK_SIGNING_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            git config gpg.format ssh
            git config user.signingkey "$KEY_FILE"
            git tag -s "${TAG}" -m "dahrk ${VERSION}"
          else
            git tag "${TAG}"
          fi
          git push origin "${TAG}"
          echo "::notice::pushed ${TAG} — release.yml will publish"
