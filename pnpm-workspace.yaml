packages:
  - "packages/*"
  - "apps/*"

# Pin @dahrk/contracts ONCE. Three packages depend on it and, pinned separately, they drifted:
# apps/edge-node sat on ^0.8.2 while packages/edge and packages/executor-worktree had moved to
# ^0.10.0. A caret on a 0.x version does not cross the minor, so a split like that silently freezes
# part of the workspace on an older wire protocol. Bump this entry, not the manifests.
catalog:
  "@dahrk/contracts": "^0.21.0"

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

# Unversioned on purpose. These are chased to latest by a scheduled job (refresh-pi-pin,
# refresh-contracts), so the release-age gate would block the very bump the job exists to propose.
# `pnpm up` writes a version-pinned entry here, which would also grow a line per Pi release.
minimumReleaseAgeExclude:
  - '@dahrk/contracts'
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
